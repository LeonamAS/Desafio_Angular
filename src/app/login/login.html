<div class="login">
    <div class="imagem">
        <img src="/img/ranger.png" alt="Ford Ranger">
    </div>
    <div class="painel-login">
        <div>
            <img src="/img/ford.png" alt="Ford">
        </div>
        <div>
            <div class="formulario">
                <h2>Boas-vindas</h2>
            </div>
            <form (ngSubmit)="onLogin()">
                <mat-form-field appearance="outline">
                    <mat-label>Insira seu e-mail</mat-label>
                    <input matInput matInput type="text" id="login" name="username" [(ngModel)]="username" required>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Insira sua senha</mat-label>
                    <input matInput [type]="hide() ? 'password' : 'text'" id="Senha" name="password"
                        [(ngModel)]="password" required>
                    <button matIconButton matSuffix (click)="clickEvent($event)" [attr.aria-label]="'Hide password'"
                        [attr.aria-pressed]="hide()">
                        <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                </mat-form-field>
                <p>Logar automaticamente
                    <mat-slide-toggle></mat-slide-toggle>
                </p>
                <div *ngIf="loginError" class="mensagemErro">
                    Usuário ou senha inválido!
                </div>
                <button class="confirmar" matButton="filled">Entrar</button>
            </form>
        </div>
        <div class="copy">
            <p>&copy; 2025 todos os direitos reservados.</p>
        </div>
    </div>
</div>
